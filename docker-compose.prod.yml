services:
  frontend:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

    build:
      context: ${FRONTEND_PATH:-../vue-diagram}
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://diagram.bby-dev.tech/api}

    container_name: diagram_frontend_prod

    expose:
      - "80"

    restart: always

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app-net
      - ai-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod

    container_name: diagram_backend_prod

    environment:
      - APP_PORT=8080

      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      - REDIS_URL=${REDIS_URL}

      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ORCHESTRATION_SERVICE_URL=http://ai-orchestration:8000

      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPEN_AI_API_KEY=${OPEN_AI_API_KEY}
      - OPEN_AI_MODEL=${OPEN_AI_MODEL:-cx/gpt-5.6-sol}
      - OPEN_AI_BASE_URL=${OPEN_AI_BASE_URL:-http://9router:20128/v1}

      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

    expose:
      - "8080"

    restart: always

    networks:
      - app-net
      - ai-network


  ai-orchestration:
    build:
      context: ./ai-orchestration
      dockerfile: Dockerfile.prod

    container_name: diagram_ai_orchestration_prod

    environment:
      - ORCHESTRATION_PORT=8000
      - REDIS_URL=${REDIS_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

      - GO_BACKEND_URL=http://backend:8080

      - AI_PROVIDER=${AI_PROVIDER:-openai}

      - OPENAI_API_KEY=${OPEN_AI_API_KEY}
      - OPENAI_MODEL=${OPEN_AI_MODEL:-cx/gpt-5.6-sol}
      - OPENAI_BASE_URL=${OPEN_AI_BASE_URL:-http://9router:20128/v1}

      - OPEN_AI_API_KEY=${OPEN_AI_API_KEY}
      - OPEN_AI_MODEL=${OPEN_AI_MODEL:-cx/gpt-5.6-sol}
      - OPEN_AI_BASE_URL=${OPEN_AI_BASE_URL:-http://9router:20128/v1}

    expose:
      - "8000"

    restart: always

    networks:
      - app-net
      - ai-network


  ai-worker:
    build:
      context: ./ai-orchestration
      dockerfile: Dockerfile.prod

    command: python worker.py

    container_name: diagram_ai_worker_prod

    environment:
      - REDIS_URL=${REDIS_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

      - GO_BACKEND_URL=http://backend:8080

      - AI_PROVIDER=${AI_PROVIDER:-openai}

      - OPENAI_API_KEY=${OPEN_AI_API_KEY}
      - OPENAI_MODEL=${OPEN_AI_MODEL:-cx/gpt-5.6-sol}
      - OPENAI_BASE_URL=${OPEN_AI_BASE_URL:-http://9router:20128/v1}

      - OPEN_AI_API_KEY=${OPEN_AI_API_KEY}
      - OPEN_AI_MODEL=${OPEN_AI_MODEL:-cx/gpt-5.6-sol}
      - OPEN_AI_BASE_URL=${OPEN_AI_BASE_URL:-http://9router:20128/v1}

    restart: always

    networks:
      - app-net
      - ai-network


networks:
  app-net:
    driver: bridge

  ai-network:
    external: true
    name: ai-network