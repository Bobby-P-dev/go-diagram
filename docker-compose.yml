services:
  # 1. PostgreSQL Database (Maps to host port 5433 to avoid conflict with host's port 5432)
  postgres:
    image: postgres:16-alpine
    container_name: diagram_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-diagram_db}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/platform/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-diagram_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis Message Broker (Port 6379)
  redis:
    image: redis:7-alpine
    container_name: diagram_redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 3. Go Backend Core API Microservice (Listens on port 8080)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diagram_backend
    network_mode: host
    environment:
      - APP_PORT=8080
      - DB_HOST=127.0.0.1
      - DB_PORT=${POSTGRES_EXTERNAL_PORT:-5433}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-diagram_db}
      - DB_SSLMODE=disable
      - REDIS_URL=redis://127.0.0.1:6379/0
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_LEGACY_CREDENTIALS=${AUTH_LEGACY_CREDENTIALS:-false}
      - ORCHESTRATION_SERVICE_URL=http://127.0.0.1:8000
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPEN_AI_API_KEY=${OPENAI_API_KEY:-${OPEN_AI_API_KEY:-${AI_API_KEY:-${MODEL_API_KEY:-${META_API_KEY:-}}}}}
      - OPEN_AI_MODEL=${OPENAI_MODEL:-${OPEN_AI_MODEL:-${AI_MODEL:-${META_MODEL:-muse-spark-1.3}}}}
      - OPEN_AI_BASE_URL=${OPENAI_BASE_URL:-${OPEN_AI_BASE_URL:-${AI_BASE_URL:-${META_BASE_URL:-https://api.meta.ai/v1}}}}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-8192}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 4. CrewAI Python Microservice Gateway (Listens on port 8000)
  ai-orchestration:
    build:
      context: ./ai-orchestration
      dockerfile: Dockerfile
    container_name: diagram_ai_orchestration
    network_mode: host
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - ORCHESTRATION_PORT=8000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - GO_BACKEND_URL=http://127.0.0.1:8080
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPEN_AI_API_KEY=${OPENAI_API_KEY:-${OPEN_AI_API_KEY:-${AI_API_KEY:-${MODEL_API_KEY:-${META_API_KEY:-}}}}}
      - OPEN_AI_MODEL=${OPENAI_MODEL:-${OPEN_AI_MODEL:-${AI_MODEL:-${META_MODEL:-muse-spark-1.3}}}}
      - OPEN_AI_BASE_URL=${OPENAI_BASE_URL:-${OPEN_AI_BASE_URL:-${AI_BASE_URL:-${META_BASE_URL:-https://api.meta.ai/v1}}}}
    volumes:
      - ./ai-orchestration:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 5. Background CrewAI Queue Worker (Redis Consumer)
  ai-worker:
    build:
      context: ./ai-orchestration
      dockerfile: Dockerfile
    container_name: diagram_ai_worker
    network_mode: host
    command: python worker.py
    volumes:
      - ./ai-orchestration:/app
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set}
      - GO_BACKEND_URL=http://127.0.0.1:8080
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPEN_AI_API_KEY=${OPENAI_API_KEY:-${OPEN_AI_API_KEY:-${AI_API_KEY:-${MODEL_API_KEY:-${META_API_KEY:-}}}}}
      - OPEN_AI_MODEL=${OPENAI_MODEL:-${OPEN_AI_MODEL:-${AI_MODEL:-${META_MODEL:-muse-spark-1.3}}}}
      - OPEN_AI_BASE_URL=${OPENAI_BASE_URL:-${OPEN_AI_BASE_URL:-${AI_BASE_URL:-${META_BASE_URL:-https://api.meta.ai/v1}}}}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
