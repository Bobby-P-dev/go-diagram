          type: string
          format: uuid
        title:
          type: string
        is_active:
          type: boolean
        view_count:
          type: integer
        share_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SharedProjectDetail:
