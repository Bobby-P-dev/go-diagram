  /api/v2/projects/{projectId}/threads/{threadId}/context/resolve:
    post:
      tags: [Generation]
      operationId: resolveV2Context
      summary: Preview project-scoped artifact and chat context without inference
      description: |
        Read-only preview; no Idempotency-Key is required and no run is created.
        Owner access and same-project membership are checked in a repeatable-read
        snapshot. Latest artifact heads are resolved to exact revision IDs.
        Explicit sources are considered in request order; project_relevant uses
        up to 50 newest non-archived artifact heads, not semantic search.
        Artifact bodies have budget priority over recent chat history. Current
        thread history is automatic; additional threads must be selected.
        Sources/messages are omitted whole, never truncated into invalid JSON.
        This is not a frozen generation input: generation must resolve again
        at acceptance. Preview source text is untrusted data, not instructions.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: threadId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2ResolveContextRequest'
            example:
              mode: explicit
              sources:
                - artifact_id: '44444444-4444-4444-8444-444444444444'
              max_content_bytes: 49152
      responses:
        '200':
          description: Exact included refs, budget omissions and history limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ContextEnvelope'
        '400':
          description: Invalid identifiers, selections, unknown fields or budget
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2ErrorEnvelope'}
        '401':
          description: Authentication required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2ErrorEnvelope'}
        '404':
          description: Project, thread or non-archived source not accessible in scope
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2ErrorEnvelope'}
        '413':
          description: Request exceeds 32 KiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2ErrorEnvelope'}
        '422':
          description: Project title and description alone exceed content budget
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2ErrorEnvelope'}
        '500':
          description: Context read failed; no partial preview returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2ErrorEnvelope'}
