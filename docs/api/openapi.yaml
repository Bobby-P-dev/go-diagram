openapi: 3.0.3
info:
  title: Visual Workspace Backend API
  version: 0.1.0
  description: |
    Baseline contract for the Go backend. This file records current behavior, not a redesign.
    Successful JSON endpoints use the `{status, message, data}` envelope. `/health` and `/` return
    direct JSON objects. Browser login uses a revocable HttpOnly cookie session, not JWTs.
    Cookie-authenticated writes require X-CSRF-Token from login/session responses and an allowed
    Origin when sent. The legacy credential-key bearer mechanism is disabled by default;
    AUTH_LEGACY_CREDENTIALS=true is a temporary compatibility opt-in only.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: System
  - name: Auth
  - name: Admin
  - name: Diagram
  - name: Sharing
  - name: UI Design
  - name: Async AI
  - name: Workspace
  - name: Product
  - name: Artifact
  - name: Generation
security:
  - browserSession: []
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: passwordLogin
      security: []
      summary: Sign in with email and password and rotate the browser session
      description: |
        Requires application/json; body limited to 4096 bytes. Returns a generic error for
        unknown email, wrong password, inactive or expired identity. Passwords are not trimmed.
        Rate limited to 10 attempts per normalized email and 100 per direct peer IP per 15 minutes.
        Sets vw_session, HttpOnly, SameSite=Lax, Path=/, with a 12-hour absolute lifetime.
        Secure is enabled by default and mandatory in the production Compose configuration.
        Session secrets are not returned in JSON; csrf_token is retained in browser memory only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 256}
      responses:
        '200':
          description: Login accepted and cookie set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserSessionEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {description: Content-Type must be application/json}
        '429': {description: Attempt or password verifier concurrency limit reached; Retry-After 900 seconds}
        '500': {description: Authentication storage unavailable}
  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getBrowserSession
      security: [{browserSession: []}]
      summary: Restore the current browser identity and CSRF token
      responses:
        '200':
          description: Active session, Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserSessionEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {description: Profile storage unavailable}
    delete:
      tags: [Auth]
      operationId: revokeBrowserSession
      security: [{browserSession: []}]
      summary: Revoke the current session and expire its cookie
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: Session revoked and cookie expired
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {description: Session could not be revoked; client must not assume logout succeeded}
  /api/v2/projects/{projectId}/threads/{threadId}/generations:
    post:
      tags: [Generation]
      operationId: startV2Generation
      summary: Start an asynchronous generation run from a trigger message
      description: |
        Validates the trigger message and project ownership, freezes the exact
        resolved context manifest, and inserts a queued generation run record.
        Requires an authenticated browser session (or opt-in legacy Bearer authentication)
        and an Idempotency-Key header. Cookie-authenticated writes also require X-CSRF-Token.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: threadId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2StartGenerationRequest'
      responses:
        '202':
          description: Generation run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2GenerationRunEnvelope'
        '400':
          description: Invalid request or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '409':
          description: Idempotency conflict or revision conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '422':
          description: Context budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
  /api/v2/projects/{projectId}/generations/{runId}:
    get:
      tags: [Generation]
      operationId: getV2Generation
      summary: Get the current status and committed results of a generation run
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Generation run retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2GenerationRunEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '404':
          description: Generation run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
  /api/v2/projects/{projectId}/generations/{runId}/cancel:
    post:
      tags: [Generation]
      operationId: cancelV2Generation
      summary: Request cooperative cancellation of a generation run
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Generation run canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2GenerationRunEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '404':
          description: Generation run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '409':
          description: Generation run is already in terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
  /api/v2/projects/{projectId}/generations/{runId}/events:
    get:
      tags: [Generation]
      operationId: streamV2GenerationEvents
      summary: Subscribe to real-time server-sent events for a generation run
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '404':
          description: Generation run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ErrorEnvelope'
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Container health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /:
    get:
      tags: [System]
      operationId: getServiceInfo
      security: []
      summary: Service information
      responses:
        '200':
          description: Running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfoResponse'
  /api/auth/verify:
    post:
      tags: [Auth]
      operationId: verifyCredential
      deprecated: true
      security: []
      summary: Exchange a credential key for the current user profile
      description: Disabled by default; returns 404 unless AUTH_LEGACY_CREDENTIALS=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCredentialRequest'
            example:
              credential_key: "RL-XXXX-XXXX-XXXX"
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404': {description: Legacy credential login disabled}
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the browser session or acknowledge opt-in legacy client logout
      description: Cookie requests require X-CSRF-Token. Legacy bearer logout remains stateless.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/credentials:
    get:
      tags: [Admin]
      operationId: listCredentials
      summary: List access credentials
      description: Requires an admin credential. Every returned credential_key is a display mask, not a usable token or digest.
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CredentialSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Admin]
      operationId: createCredential
      summary: Create an access credential
      description: Requires an admin credential. Returns the full raw token in credential_key once; subsequent reads return a masked string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CredentialSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/CredentialID'
    put:
      tags: [Admin]
      operationId: updateCredential
      summary: Update an access credential
      description: Requires an admin credential. The returned credential_key is a display mask, not the raw bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CredentialSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Admin]
      operationId: deleteCredential
      summary: Delete an access credential
      description: Requires an admin credential.
      responses:
        '200':
          description: Credential deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/projects:
    get:
      tags: [Diagram]
      operationId: listProjects
      summary: List projects owned by the authenticated user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 15
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedProjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Diagram]
      operationId: createProject
      summary: Create a diagram project
      description: Requires `can_generate_diagram`. An empty prompt creates an empty canvas; a template ID loads a template; otherwise the AI generates the initial graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              prompt: "Buat flow login pengguna"
              diagram_type: "flowchart"
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Diagram]
      operationId: getProject
      summary: Get a project and its chat history
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/chat:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Diagram]
      operationId: chatProject
      summary: Iterate a diagram with the AI copilot
      description: Requires `can_generate_diagram` and project ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              prompt: "Tambahkan langkah verifikasi OTP"
              targeted_node_ids: ["step_login"]
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/projects/{id}/pin:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Diagram]
      operationId: toggleProjectPin
      summary: Toggle a project's pinned state
      responses:
        '200':
          description: Pin toggled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TogglePinResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/projects/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Diagram]
      operationId: listProjectVersions
      summary: List diagram snapshots
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DiagramVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/projects/{id}/rollback/{versionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: versionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Diagram]
      operationId: rollbackProject
      summary: Restore a project snapshot
      description: Restores the snapshot, appends an assistant message, and records a new rollback version.
      responses:
        '200':
          description: Project rolled back
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/projects/{id}/graph:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    put:
      tags: [Diagram]
      operationId: updateProjectGraph
      summary: Persist canvas node and edge changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGraphRequest'
      responses:
        '200':
          description: Graph updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/templates:
    get:
      tags: [Diagram]
      operationId: listDiagramTemplates
      summary: List diagram templates
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DiagramTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/projects/{id}/share:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [Sharing]
      operationId: createProjectShare
      summary: Create or return a project share link
      description: Requires project ownership.
      responses:
        '200':
          description: Share link
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectShare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Sharing]
      operationId: getProjectShare
      summary: Get a project's share status
      responses:
        '200':
          description: Share status or `{is_active:false}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Sharing]
      operationId: revokeProjectShare
      summary: Revoke a project's share link
      responses:
        '200':
          description: Share revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          is_active:
                            type: boolean
                            enum: [false]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/shared/{token}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      tags: [Sharing]
      operationId: getSharedProject
      security: []
      summary: Read a shared project without authentication
      responses:
        '200':
          description: Shared project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SharedProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shared/{token}/fork:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    post:
      tags: [Sharing]
      operationId: forkSharedProject
      summary: Clone a shared project into the authenticated user's workspace
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSharedProjectRequest'
      responses:
        '201':
          description: Forked project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
