components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: vw_session
      description: Opaque browser session secret; only its SHA-256 hash is stored server-side.
    bearerAuth:
      type: http
      scheme: bearer
      description: Legacy raw access credential key, disabled unless AUTH_LEGACY_CREDENTIALS=true. Not JWT.
    internalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
      description: Shared secret used by the Python worker for callbacks.
  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Credential lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not owned by the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        data:
          nullable: true
    ErrorEnvelope:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error:
          type: string
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [healthy]
        service:
          type: string
    ServiceInfoResponse:
      type: object
      required: [service, status, health]
      properties:
        service:
          type: string
        status:
          type: string
        health:
          type: string
    VerifyCredentialRequest:
      type: object
      required: [credential_key]
      properties:
        credential_key:
          type: string
          description: The full raw bearer credential, not a display mask or stored digest. Existing credentials remain valid after migration.
          minLength: 1
    BrowserSessionEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status: {type: string, enum: [success]}
        message: {type: string}
        data:
          type: object
          required: [user, csrf_token]
          properties:
            csrf_token: {type: string, minLength: 64, maxLength: 64}
            user:
              type: object
              required: [id, email, name, role, is_active, can_generate_diagram, can_generate_ui]
              properties:
                id: {type: string, format: uuid}
                email: {type: string, format: email}
                name: {type: string}
                role: {type: string}
                is_active: {type: boolean}
                can_generate_diagram: {type: boolean}
                can_generate_ui: {type: boolean}
    AuthUser:
      type: object
      required: [id, credential_key, name, role, is_active, can_generate_diagram, can_generate_ui, is_expired, expires_in_human]
      properties:
        id:
          type: string
          format: uuid
        credential_key:
          type: string
          description: Display mask only; not a usable bearer token or stored digest. Use LoginResponse.token for authentication.
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        is_active:
          type: boolean
        can_generate_diagram:
          type: boolean
        can_generate_ui:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_expired:
          type: boolean
        expires_in_human:
          type: string
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: The access credential key returned as the bearer token.
        user:
          $ref: '#/components/schemas/AuthUser'
    CredentialSummary:
      type: object
      required: [id, credential_key, name, role, is_active, can_generate_diagram, can_generate_ui, is_expired, expires_in_human, project_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        credential_key:
          type: string
          description: Full generated token only in the create response. All list and update responses return a display mask ending in eight asterisks.
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        is_active:
          type: boolean
        can_generate_diagram:
          type: boolean
        can_generate_ui:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_expired:
          type: boolean
        expires_in_human:
          type: string
        project_count:
          type: integer
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCredentialRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        duration_minutes:
          type: integer
          minimum: 0
        duration_hours:
          type: integer
          minimum: 0
        duration_days:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [user, admin]
          default: user
        expires_at:
          type: string
          description: Optional ISO-8601 date/time.
        can_generate_diagram:
          type: boolean
        can_generate_ui:
          type: boolean
    UpdateCredentialRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        is_active:
          type: boolean
        extend_minutes:
          type: integer
        extend_hours:
          type: integer
        extend_days:
          type: integer
        duration_minutes:
          type: integer
        duration_hours:
          type: integer
        duration_days:
          type: integer
        expires_at:
          type: string
          nullable: true
        set_permanent:
          type: boolean
        can_generate_diagram:
          type: boolean
        can_generate_ui:
          type: boolean
    CreateProjectRequest:
      type: object
      properties:
        prompt:
          type: string
        diagram_type:
          type: string
          default: flowchart
        template_id:
          type: string
          nullable: true
    ChatRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        message:
          type: string
        instruction:
          type: string
        foundation:
          type: string
        targeted_node_ids:
          type: array
          items:
            type: string
        selected_component_id:
          type: string
        target:
          type: object
          additionalProperties: true
        selection_context:
          type: object
          additionalProperties: true
        version_number:
