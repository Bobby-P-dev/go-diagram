    V2StartGenerationRequest:
      type: object
      description: >-
        Starts document or diagram generation from a saved user message. The server
        freezes context revisions and, for a target revision, its base content.
        Prompts and base graph snapshots are loaded server-side; evidence is selected
        through the context selectors and lineage is derived from the frozen manifest.
        Optional mutation requires a graph output and both target revision identifiers.
        It updates only selected existing elements, preserves the artifact title, and
        never adds/deletes elements or changes identities, node types, edge endpoints,
        or sequence numbers. Omit mutation for new artifacts or full revisions.
      required: [trigger_message_id, output_type]
      additionalProperties: false
      properties:
        trigger_message_id:
          type: string
          format: uuid
        output_type:
          type: string
          enum: [brainstorm, prd, erd, flowchart, sequence]
          description: Brainstorm and PRD produce markdown; ERD, flowchart and sequence produce graph artifacts. Other types are not enabled yet.
        output_title:
          type: string
          maxLength: 255
        target_artifact_id:
          type: string
          format: uuid
        target_expected_revision_id:
          type: string
          format: uuid
        context:
          $ref: '#/components/schemas/V2ResolveContextRequest'
        mutation:
          $ref: '#/components/schemas/V2DiagramMutation'
    V2DiagramMutation:
      type: object
      additionalProperties: false
      required: [node_ids, edge_ids]
      description: >-
        UPDATE-only scope frozen with the target revision. Both arrays are required,
        may individually be empty, and together must contain 1..32 unique existing
        targets (unique within each category). IDs are case-sensitive. Selected node
        data and selected edge label/cardinality/message_type may change. The server
        merges a scoped model patch, validates the full graph, and preserves layout
        and unknown extension properties. An effective change is required. output_title
        must equal the existing artifact title. Invalid targets are rejected before
        inference; out-of-scope patches are repaired at most twice, then fail closed.
      properties:
        node_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$'
        edge_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$'
    V2GenerationRun:
      type: object
      description: >-
        Durable lifecycle shared by documents and diagrams. A succeeded run points
        to an atomically committed artifact, revision and assistant message. Private
        prompt and base content snapshots are never included in the run response.
      required: [id, project_id, thread_id, trigger_message_id, output_type, output_title, frozen_manifest, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        trigger_message_id:
          type: string
          format: uuid
        output_type:
          type: string
          enum: [brainstorm, prd, erd, flowchart, sequence]
        output_title:
          type: string
        target_artifact_id:
          type: string
        target_expected_revision_id:
          type: string
        mutation:
          $ref: '#/components/schemas/V2DiagramMutation'
        frozen_manifest:
          $ref: '#/components/schemas/V2ContextManifest'
        status:
          type: string
          enum: [queued, running, cancel_requested, succeeded, failed, canceled]
        error_code:
          type: string
        error_message:
          type: string
        committed_artifact_id:
          type: string
        committed_revision_id:
          type: string
        committed_message_id:
          type: string
        created_at:
